# KubePlayground - Docker Compose Configuration
# ==============================================
# Architecture:
#   Frontend (Nginx + React SPA) --> Backend (FastAPI) --> MongoDB
#
# The frontend nginx proxies /api/* requests to the backend service.
# This mirrors the eventual K8s Ingress pattern.

services:
  # ===========================================================================
  # MongoDB - Primary Database
  # ===========================================================================
  mongodb:
    image: mongo:6.0
    container_name: kubeplayground-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: development
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kubeplayground-net

  # ===========================================================================
  # Backend - FastAPI Application (Scalable)
  # ===========================================================================
  backend:
    image: ghcr.io/lelouch-britannia/kubeplayground-backend:${TAG:-latest}
    build:
      context: .
      dockerfile: core/Dockerfile
    # For scaling: docker compose up --scale backend=3
    # Frontend nginx uses least_conn load balancing
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      MONGO_PASSWORD_DEV: ${MONGO_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-please}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # Mount sample resources for seeding database
      # Inside container: /app/seed-data/k8s/kubernetes-fundamentals/pods101/*.json etc.
      - ./sample-resources:/app/seed-data:ro
      # Persist SQLite database for IAM (user accounts, sessions, activity)
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kubeplayground-net
    # Note: No ports exposed - accessed via frontend nginx reverse proxy
    # For debugging, uncomment:
    ports:
      - "8000:8000"

  # ===========================================================================
  # Frontend - Nginx + React SPA
  # ===========================================================================
  # Handles:
  #   - Static file serving (React build)
  #   - SPA routing (try_files -> index.html)
  #   - Reverse proxy /api/* -> backend:8000
  #   - SSL termination (self-signed for dev)
  frontend:
    image: ghcr.io/lelouch-britannia/kubeplayground-frontend:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kubeplayground-frontend
    restart: unless-stopped
    ports:
      - "8001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kubeplayground-net

  # ===========================================================================
  # Validation Service - K8s YAML Validation (Golang)
  # ===========================================================================
  validation-service:
    image: ghcr.io/lelouch-britannia/kubeplayground-validation-service:${TAG:-latest}
    build:
      context: ./validation-service
      dockerfile: Dockerfile
    container_name: kubeplayground-validation
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-please}
      LOG_LEVEL: info
      KUBECONFIG: /root/.kube/config
    volumes:
      # Mount host kubeconfig for cluster access
      - ${HOME}/.kube/config:/root/.kube/config:ro
      # Mount minikube certificates
      - ${HOME}/.minikube:${HOME}/.minikube:ro
      # Mount config directory
      - ./validation-service/config:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kubeplayground-net
      - minikube
    ports:
      - "8082:8080"  # Expose for debugging

  # ===========================================================================
  # Database Seeder - One-time initialization
  # ===========================================================================
  seed:
    image: curlimages/curl:latest
    container_name: kubeplayground-seed
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Seeding Pods 101...' &&
        curl -X POST 'http://backend:8000/api/v1/seed/populate?topic_dir=/app/seed-data/k8s/kubernetes-fundamentals/pods101' &&
        echo '' &&
        echo 'Seeding ReplicaSet 101...' &&
        curl -X POST 'http://backend:8000/api/v1/seed/populate?topic_dir=/app/seed-data/k8s/kubernetes-fundamentals/replicaset101' &&
        echo '' &&
        echo 'Seeding Deployment 101...' &&
        curl -X POST 'http://backend:8000/api/v1/seed/populate?topic_dir=/app/seed-data/k8s/kubernetes-fundamentals/deployment101' &&
        echo '' && echo 'Seeding complete!'
      "
    networks:
      - kubeplayground-net
    restart: "no"

# ===========================================================================
# Networks
# ===========================================================================
networks:
  kubeplayground-net:
    driver: bridge
  minikube:
    external: true
    name: minikube

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  sqlite_data:
    driver: local
    # Stores: user accounts, refresh tokens, activity logs, streaks
