# Define an upstream block for FastAPI backend service
upstream fastapi_service {
    least_conn; # Use least connections strategy for load balancing
    server backend:8000; # FastAPI service - update this to match your backend service name
}

# HTTP server (development)
server {
    listen 80;
    server_name _;

    # Root directory for Vite build output
    root /usr/share/nginx/html;
    index index.html;

    # Serve the main static files and handle routing for SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket Proxy - Forward /ws/ requests to FastAPI backend
    location /ws/ {
        proxy_pass http://fastapi_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for WebSocket connections
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API Reverse Proxy - Forward /api/ requests to FastAPI backend
    # Frontend sends: /api/dashboard -> Backend receives: /api/dashboard
    location /api/ {
        proxy_pass http://fastapi_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve Vite assets directory with caching
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve CSS, JavaScript, and static media files with caching
    location ~* \.(?:css|js|map|ttf|otf|woff|woff2|eot|svg|jpg|jpeg|png|gif|webp|ico)$ {
        root /usr/share/nginx/html;
        access_log off;
        expires 6M; # Cache static files for 6 months
        add_header Cache-Control "public, immutable";
    }

    # Serve favicon
    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 404 /index.html;

    # Prevent access to hidden files or folders
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
