worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Compression and performance tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/font-woff application/font-woff2 image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Global server timeout settings
    client_max_body_size 50M;
    client_body_timeout 15s;
    client_header_timeout 10s;
    sendfile on;
    send_timeout 15s;
    keepalive_timeout 30s;

    # Include site-specific configurations from sites-enabled
    include /etc/nginx/sites-enabled/*;
}
