<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KubePlayground - Interactive Kubernetes Learning Platform" />
    <meta name="theme-color" content="#1e1e1e" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>KubePlayground</title>
  </head>
  <body class="dark">
    <div id="root"></div>
    <!-- This script tag connects the HTML to your React code -->
    <script type="module" src="/src/index.tsx"></script>

    <!-- Theme initialization to prevent flash -->
    <script>
      (function() {
        const theme = localStorage.getItem('kp_theme') || 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.body.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </body>
</html>
