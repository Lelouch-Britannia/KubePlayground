[tool.ruff]
target-version = "py310"
line-length = 120

exclude = [
    "sample-resources/",
    "*.ipynb",
    "validation-service/"
]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    # "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear - bug patterns
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # McCabe - complexity
    "D",     # Pydocstyle - docstrings
    "DTZ",   # flake8-datetimez - timezone aware
    "E",     # Pycodestyle errors
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "F",     # Pyflakes - syntax errors and basic mistakes
    "FAST",  # FastAPI - FastAPI-specific rules
    "FBT",   # flake8-boolean-trap
    "G",     # flake8-logging-format
    "I",     # isort - import ordering
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420 - requires __init__.py
    "ISC",   # flake8-implicit-str-concat
    "N",     # PEP8 naming
    "NPY",   # NumPy-specific
    "PD",    # pandas-vet
    "PERF",  # perflint - performance
    "PIE",   # flake8-pie - improvements
    "PL",    # Pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib - prefer pathlib
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit - security
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger
    "T20",   # flake8-print - no print statements
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops - exception handling
    "UP",    # Pyupgrade - modern Python syntax
    "W",     # Pycodestyle warnings
    "YTT",   # flake8-2020 - sys.version checks
]

ignore = [
    "B027",    # Allow non-abstract empty methods in abstract base classes
    "B904",    # Exception chaining not always needed in SDK error wrapping
    "BLE001",  # Catching Exception acceptable in decorators/wrappers
    "C901",    # Ignore complexity (practical for SDK abstractions)
    # Docstring
    # ------------------------------------------------------------------------
    "D100",    # Missing docstring in public module (add when documenting)
    "D101",    # Missing docstring in public class (add when documenting)
    "D102",    # Missing docstring in public method (add when documenting)
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__ (done in class docstring)
    "D203",    # Pydocstyle - one-blank-line-before-class
    # -------------------------------------------------------------------------
    "E501",    # Allow long lines (enforced by line-length instead)
    "EM101",   # String literals in exceptions (common in SDK error wrapping)
    "F401",    # Allow unused imports in __all__ (common pattern for re-exports)
    "FBT001",  # Boolean arguments acceptable in SDK interfaces
    "N818",    # Exception naming convention (existing name is fine)
    # Complexity
    # -------------------------------------------------------------------------
    "PLR0912", # Ignore complexity - too many branches
    "PLR0913", # Ignore complexity - too many arguments
    "PLR0915", # Ignore complexity - too many statements
    # -------------------------------------------------------------------------
    "RET504",  # Unnecessary variable assignment before return
    "RUF012",  # Class variable type annotations not critical
    # TRY exception handling
    # -------------------------------------------------------------------------
    "TRY003",  # Long exception messages not in exception class (common in SDK error wrapping)
    "TRY201",  # Exception handling style preferences
    "TRY300",  # Exception handling style preferences
    # -------------------------------------------------------------------------
]

[tool.ruff.lint.isort]
known-first-party = ["daolib"]
lines-after-imports = 2

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: allow magic values, assertions, relative imports, no docstrings, print, pseudorandomness
# PT009/PT027 - unittest-style assertions are fine, BLE001 - catching Exception in test cleanup is acceptable
# PLC0415 - local imports in tests, S314 - XML parsing in tests, T203 - pprint for debugging
# B017 - asserting on Exception is acceptable in unittest tests, PD901 - df is acceptable in tests
"**/tests/**/*" = ["ANN", "PLR2004", "S101", "TID252", "D", "S311", "T201", "PTH", "PT009", "PT027", "BLE001", "PLC0415", "S314", "T203", "B017", "PD901"]
"**/test_*.py" = ["ANN", "PLR2004", "S101", "TID252", "D", "S311", "T201", "PTH", "PT009", "PT027", "BLE001", "PLC0415", "S314", "T203", "B017", "PD901"]
# CI scripts: allow prints, magic values, assertions, no docstrings
"ci/**/*" = ["T201", "PLR2004", "S101", "D", "S311", "INP001"]
# Setup files: allow magic values, no __init__.py requirement
"**/setup.py" = ["PLR2004", "D100", "INP001"]
# SQLAlchemy event hooks use context._query_start_time for per-execution timing (standard pattern)
"SDKs/DAO/daolib/drivers/sql/driver.py" = ["SLF001"]
# Config validation: raising inside try to verify file exists before reading is intentional
"core/utils/mongo_helper.py" = ["TRY301"]
